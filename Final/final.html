<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype for Final</title>
    <link rel="stylesheet" href="final.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="final.js" defer></script>
</head>

<body>
<div id="game">

    <div id="status">
        Orders Served: <span id="score">0</span>
    </div>

    <!-- Customer -->
    <div id="customer-area">
        <div id="customer">
            <div id="customer-number"></div>
        </div>
    </div>

    <div id="flavor-area">

        <div class="flavor" data-flavor="1">
            <div class="tooltip">Flavor 1</div>
            <div class="flavor-box"></div>
        </div>

        <div class="flavor" data-flavor="2">
            <div class="tooltip">Flavor 2</div>
            <div class="flavor-box"></div>
        </div>

        <div class="flavor" data-flavor="3">
            <div class="tooltip">Flavor 3</div>
            <div class="flavor-box"></div>
        </div>

        <div class="flavor" data-flavor="4">
            <div class="tooltip">Flavor 4</div>
            <div class="flavor-box"></div>
        </div>

    </div>

    <div id="truck">
        <h1>ICE CREAM TRUCK!!!</h1>
    </div>

    <div id="dialogue-area">
        <p id="dialogue">Waiting for a jolly customer to arrive...</p>
    </div>

</div>
</body>

</html>
